[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fyodor-macro-signal"
version = "0.1.0"
description = "Isolated quantitative backtesting and setup registration engine for Fyodor Macro Signal (FMS)"
readme = "README.MD"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "polars>=1.9.0",
    "numpy>=2.1.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
fms = "fms_engine.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

